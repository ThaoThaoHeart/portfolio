<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrong Platform · 404</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f3f2ee; --ink: #141414; --muted: #5b5f63; --red: #0f5552; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121821; --ink: #f3f2ee; --muted: #a3a9b1; --red: #4fa39c; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
             background: var(--bg); color: var(--ink); font-family: ui-monospace, Menlo, monospace; text-align: center; }
      .code { font-size: clamp(64px, 18vw, 140px); font-weight: 700; letter-spacing: -0.04em; margin: 0; }
      .code span { color: var(--red); }
      p { color: var(--muted); max-width: 36ch; margin: 8px auto 28px; line-height: 1.6; }
      a { color: var(--ink); border: 2px solid var(--ink); padding: 10px 18px; text-decoration: none; font-weight: 600; }
      a:hover { background: var(--ink); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">4<span>0</span>4</p>
      <p>This platform doesn't exist. The train you're looking for left from the main station.</p>
      <a href="/">Return to origin →</a>
    </main>
  </body>
</html>
